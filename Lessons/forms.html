<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>

    <style>
        body{
            text-align: center;
        }
        form{
            display: inline-block;
            /* width: fit-content; */
            padding: 1em;
            border: 1px solid #cccccc;
            border-radius: 1em;
        }
        p + p{
            margin-top: 1rem;
        }
        label{
            display: inline-block;
            min-width: 90px;
            text-align: right;
        }
        input, textarea{
            font: 1em sans-serif;
            width: 300px;
            box-sizing: border-box;
            border: 1px solid #999999;
        }
        input:focus, textarea:focus{
            outline-style: solid;
            outline-color: black;
        }
        textarea{
            vertical-align: top;
            height: 5rem;
        }
        .button{
            padding-left: 90px;
        }
        button{
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

    <h1>Contact Form</h1>

    <form action="#" method="post">
        <p>
            <label for="name">Name : </label>
            <input type="text" name="nameBox" id="name" >
        </p>
        <p>
            <label for="email">Email : </label>
            <input type="email" name="mailBox" id="email">
        </p>
        <p>
            <label for="message">Message : </label>
            <textarea name="msgBox" id="message" rows="5"></textarea>
        </p>
        <p class="button">
            <button type="submit">Send your message</button>
        </p>
    </form>
    <hr>
    <form action="#" method="post">
        <label >
            Name : 
            <input type="text" name="" id="">
        </label>
    </form>
</body>
</html>
